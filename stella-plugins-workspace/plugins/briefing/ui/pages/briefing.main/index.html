<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简报</title>
  <style>
    :root { color-scheme: light; font-family: "SF Pro Text", "PingFang SC", sans-serif; }
    body { margin: 0; padding: 24px; background: #f6f4ef; color: #1c1917; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #57534e; }
    button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #1c1917; background: #1c1917; color: #fafaf9; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 0.9rem; white-space: pre-wrap; }
    #list { margin-top: 20px; display: grid; gap: 8px; }
    .row { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <h1>简报</h1>
  <p>受限插件页 · stella.briefing · 经宿主 Bridge 读写，不持有 Core React / Node。</p>
  <button id="refresh" type="button">刷新列表</button>
  <div id="status"></div>
  <div id="list"></div>
  <script src="./app.js"></script>
</body>
</html>

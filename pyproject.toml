[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stella"
dynamic = ["version"]
description = "Stella - personal AI secretary"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[tool.ruff]
target-version = "py39"

[project.scripts]
stella = "cli.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["cli*"]
